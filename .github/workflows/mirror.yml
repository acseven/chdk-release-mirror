name: Mirror upstream release

# Stable CHDK releases appear roughly once a year, so this is a cheap weekly
# poll plus a manual trigger. sync.py check exits without work when the
# upstream tag already has a release here, which is almost every run.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release; nothing else

concurrency:
  group: mirror
  cancel-in-progress: false   # a half-uploaded release is worse than a late one

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No pip install: sync.py is stdlib-only by design. svn is not on the
      # ubuntu-latest image by default and is the one real dependency.
      - name: Install subversion
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion

      - name: Self-test
        run: python3 sync.py selftest

      # needed is asset-level, not tag-level: a release that exists but is
      # missing assets still needs work, which is what makes resume possible.
      - id: check
        name: Check upstream
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_REPO: ${{ github.repository }}
        run: python3 sync.py check

      - name: Fetch and verify
        if: steps.check.outputs.needed == 'true'
        run: python3 sync.py fetch

      # cameras.json goes first, on purpose. It is ~90 KB and it is the only
      # thing the Flarum extension reads; the 780 archives are the mirror's
      # own job. Publishing it before the upload means a throttled or failed
      # upload can no longer withhold the extension's data. The firmware URLs
      # inside it 404 until the matching assets land, which is a few minutes
      # in the good case and self-heals on the next run in the bad one.
      - name: Commit cameras.json
        if: steps.check.outputs.needed == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add cameras.json
          # unchanged on a resumed run -- not an error
          git diff --cached --quiet || git commit -m "cameras.json: $TAG"
          git push

      # ~780 assets. gh release create takes them in one call with no pacing,
      # no backoff and no resume, which is what tripped GitHub's secondary
      # rate limit and discarded the whole release. sync.py upload creates the
      # release once, then uploads serially with backoff, skipping anything
      # already there, so a throttled run resumes rather than restarts.
      - name: Publish release
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_REPO: ${{ github.repository }}
        run: python3 sync.py upload
